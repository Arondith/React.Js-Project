services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: issueforge
      POSTGRES_USER: issueforge
      POSTGRES_PASSWORD: issueforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issueforge -d issueforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - issueforge_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/issueforge
      DATABASE_USERNAME: issueforge
      DATABASE_PASSWORD: issueforge
      DATABASE_DRIVER: org.postgresql.Driver
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  issueforge_data:
